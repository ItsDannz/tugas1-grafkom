    <title>Tugas 1 Grafika Komputer</title>
    <style>
        body {

            display: flex;
            flex-direction: column;

            margin: 0;
            padding: 20px;
        }

        .card {
            background: #fff;
            padding: 15px;

            flex-direction: row;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }

        canvas, img {
            border: 2px solid #333;
            border-radius: 4px;
            width: 600px;
            height: 400px;
            object-fit: contain;
            background-color: #fff;
        }
